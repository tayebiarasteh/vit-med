name: vitmed
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy=1.22
  - scipy=1.10
  - pandas=1.4
  - scikit-learn=1.2
  - scikit-image
  - statsmodels
  - jupyter
  - tqdm
  - omegaconf
  - fvcore
  - iopath
  - tensorboardx
  - torchmetrics=0.10.3
  - nibabel
  - pydicom
  - pip:
      - torch==2.8.0
      - torchvision==0.23.0
      - timm==0.6.13
      - submitit @ git+https://github.com/facebookincubator/submitit
      - transformers==4.56.0
      - huggingface-hub==0.34.4
      - datasets==2.19.1
      - accelerate==1.10.0
      - tokenizers==0.21.0
      - safetensors==0.4.5
      - opencv-python==4.7.0.72
      - torchio==0.18.91
      - tensorboard
      - pylibjpeg[libjpeg,openjpeg,rle]